# A config.d drop-in: copy to ~/.config/notice-route/config.d/ after defining destinations phone,
# team-chat and desktop in config.yaml. It holds the producer rules; config.example.yaml holds the
# destinations phone, team-chat and desktop and the router's own rules. It holds rules only; rule
# names must not be used in your own config.
#
# Wiring hazard: wire either agent-spawn's or claude-session's state hooks to notifications, not
# both (see "Wiring hazards" in docs/interface.md). The rules below are for agent-spawn.

rules:
  # A launch is not worth a notification. drop allows only name and match.
  - name: launch-drop
    match:
      source: agent-spawn
      hook: post-launch
    drop: true

  - name: agent-done
    match:
      source: agent-spawn
      hook: post-state-change
      where:
        state: reported
    notify: [team-chat]
    level: info
    title: "Agent done"
    message: "Agent {{object_id}} reported (state {{state}})."

  # Attention is routed from post-escalate only: it fires once when needs_attention changes,
  # while post-state-change repeats needs_attention on every later event.
  - name: agent-failed
    match:
      source: agent-spawn
      hook: post-escalate
      where:
        needs_attention: failed
    notify: [phone, team-chat]
    level: error
    title: "Agent failed"
    message: "Agent {{object_id}} failed."

  - name: agent-lost
    match:
      source: agent-spawn
      hook: post-escalate
      where:
        needs_attention: lost
    notify: [phone, team-chat]
    level: error
    title: "Agent lost"
    message: "Agent {{object_id}} was lost."

  - name: agent-launch-failed
    match:
      source: agent-spawn
      hook: post-escalate
      where:
        needs_attention: launch_failed
    notify: [phone, team-chat]
    level: error
    title: "Agent launch failed"
    message: "Agent {{object_id}} failed to launch."

  # Covers needs-input too: a needs-input outcome sets needs_attention to escalated.
  - name: agent-escalated
    match:
      source: agent-spawn
      hook: post-escalate
    notify: [phone, desktop]
    level: action
    title: "Agent needs attention"
    message: "Agent {{object_id}} needs attention ({{needs_attention}})."
    dedup_window: 30m

  - name: review-draft-ready
    match:
      source: review-watch
      hook: post-draft
    notify: [team-chat]
    level: info
    title: "Review draft ready"
    message: "Draft {{draft_id}} for {{pr}} is ready (tier {{tier}})."
    link: "{{pr_url}}"

  - name: review-escalated
    match:
      source: review-watch
      hook: post-attention
      where:
        reason: escalated
    notify: [phone, team-chat]
    level: action
    title: "Review escalated"
    message: "Review attention ({{reason}}) for {{object_id}}."
    link: "{{pr_url}}"

  - name: review-failed
    match:
      source: review-watch
      hook: post-attention
      where:
        reason: failed
    notify: [phone, team-chat]
    level: error
    title: "Review failed"
    message: "Review attention ({{reason}}) for {{object_id}}."
    link: "{{pr_url}}"

  # A host-level attention (the host cannot be polled): no PR, so no link.
  - name: review-poll-failed
    match:
      source: review-watch
      hook: post-attention
      where:
        reason: poll_failed
    notify: [team-chat]
    level: warn
    title: "Review polling failed"
    message: "Review watch cannot poll {{object_id}}."

  - name: review-attention
    match:
      source: review-watch
      hook: post-attention
    notify: [team-chat]
    level: warn
    title: "Review needs attention"
    message: "Review attention ({{reason}}) for {{object_id}}."
    link: "{{pr_url}}"

  - name: ticket-attention
    match:
      source: ticket-work
      hook: post-attention
    notify: [phone, team-chat]
    level: action
    title: "Ticket needs attention"
    message: "Ticket {{key}} needs attention ({{reason}}, phase {{phase}})."
    link: "{{ticket_url}}"

  - name: ticket-pending
    match:
      source: ticket-work
      hook: post-pending
    notify: [phone, team-chat]
    level: action
    title: "Confirmation pending"
    message: "Ticket {{key}} has a pending {{action}} confirmation."
    link: "{{ticket_url}}"

  - name: ticket-start-failed
    match:
      source: ticket-work
      hook: post-start-failed
    notify: [phone, team-chat]
    level: error
    title: "Ticket start failed"
    message: "Starting ticket {{key}} failed."
    link: "{{ticket_url}}"

  - name: job-held
    match:
      source: jobsctl
      hook: post-held
    notify: [phone, team-chat]
    level: action
    title: "Job held"
    message: "Job {{object_id}} is held."

  # job.status queued is also a failure, with a retry scheduled: only a final failure is routed.
  - name: job-failed
    match:
      source: jobsctl
      hook: post-fail
      where:
        job.status: failed
    notify: [phone, team-chat]
    level: error
    title: "Job failed"
    message: "Job {{object_id}} failed."

  - name: pr-approved
    match:
      source: pr-watch
      hook: on-approved
    notify: [team-chat]
    level: info
    title: "PR approved"
    message: "{{pr}} was approved."
    link: "{{pr_url}}"

  - name: pr-changes-requested
    match:
      source: pr-watch
      hook: on-changes_requested
    notify: [team-chat]
    level: warn
    title: "Changes requested"
    message: "Changes were requested on {{pr}}."
    link: "{{pr_url}}"
